<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tag de imagem</title>
  </head>
  <body>
    <h1>Tag de imagem</h1>

    <!-- img - imagem
    src - source (origem, fonte)
    alt - alternative -->
    
    </figure>
      <img
        src="../imagens/praia.jpg"
        alt="imagem de praia"
        width="500"
        title="imagem de praia vista do alto"
      />
      <figcaption>imagem de praia</figcaption>
    </figure>
  </body>
</html>
