<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario Exercicio</title>

    <script src="./js/stylesheet.js" defer></script>
  </head>
  <body>
    <img src="./img/trello.svg" alt="logo trello" width="200" />
    <h1>Fazer login no Trello</h1>

    <form action>
      <input type="email" name="" id="email" placeholder="insira seu e-mail" />
      <input
        type="password"
        name=""
        id="password"
        placeholder="insira sua senha"
      />
      <button type="submit">Fazer login</button>

      <span>ou</span>

      <button type="button">
        <img src="./img/google.svg" alt="Logo Google" width="20" />continuar com
        o Google
      </button>

      <button type="button">
        <img
          src="./img/microsoft.svg"
          alt="logo Microsoft"
          width="20"
        />continuar com a Microsoft
      </button>

      <button type="button">
        <img src="./img/apple.svg" width="20" alt="logo Apple" />continuar com a
        Apple
      </button>

      <button type="button">
        <img src="./img/slack.svg" width="20" alt="logo Slack" />continuar com o
        slack
      </button>
    </form>

    <img src="./img/atlassian.svg" alt="logo Atlassian" width="200" />
    <img src="./img/analytics.svg" alt="logo Analytics" width="200" />
    <img src="./img/interactive.svg" alt="logo Interactive" width="200" />
  </body>
</html>
